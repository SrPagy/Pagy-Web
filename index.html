    <!-- Cursor Effect -->

    <script>
        window.addEventListener("load", () => {

            new cursoreffects.fairyDustCursor({
                colors: [
                    "#39FF14",
                    "#FF1493",
                    "#FF4500",
                    "#CCFF00",
                    "#8D00FF",
                    "#00E5FF"
                ]
            });

        });
    </script>

    <!-- Música -->
    <script>
    const muteBtn = document.getElementById("mute-btn");
    const musicIframe = document.getElementById("bg-music");

    let paused = localStorage.getItem("paused") === "true";

    muteBtn.textContent = paused ? "🔇" : "🔊";

    // 🌟 NUEVA FUNCIÓN: Se encarga de aplicar los colores y el movimiento
    function actualizarAparienciaBoton() {
        if (paused) {
            muteBtn.classList.add("estado-muteado");
            muteBtn.classList.remove("estado-sonando");
        } else {
            muteBtn.classList.add("estado-sonando");
            muteBtn.classList.remove("estado-muteado");
        }
    }

    // Llamamos a la función al cargar para que tenga el color correcto desde el inicio
    actualizarAparienciaBoton();

    function postSCMessage(cmd) {
        musicIframe.contentWindow.postMessage(
            JSON.stringify({ method: cmd }),
            '*'
        );
    }

    muteBtn.addEventListener('click', () => {
        paused = !paused;

        postSCMessage(paused ? 'pause' : 'play');

        muteBtn.textContent = paused ? "🔇" : "🔊";
        localStorage.setItem("paused", paused);

        // Actualizamos los colores tras hacer clic
        actualizarAparienciaBoton();
    });

    window.addEventListener('load', () => {
        if (!paused) {
            postSCMessage('play');
            
            document.body.addEventListener(
                'click',
                () => {
                    postSCMessage('play');
                    // Por si el navegador bloqueó el autoplay inicial, 
                    // forzamos el estado a "sonando" al primer clic en la pantalla
                    paused = false;
                    muteBtn.textContent = "🔊";
                    localStorage.setItem("paused", paused);
                    actualizarAparienciaBoton();
                },
                { once: true }
            );
        }
    });
</script>
